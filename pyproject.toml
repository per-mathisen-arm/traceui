[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traceui"
version = "0.3.0"
description = "Trace UI CLI and GUI tooling for Android graphics traces"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Arm Software" },
]
keywords = ["android", "graphics", "trace", "vulkan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "pandas",
    "PySide6>=6.2.4,<7",
]

[project.urls]
Homepage = "https://github.com/ARM-software/traceui"
Repository = "https://github.com/ARM-software/traceui.git"
Issues = "https://github.com/ARM-software/traceui/issues"

[project.scripts]
traceui_cli = "traceui_cli:main"

[tool.setuptools]
py-modules = ["traceui_cli", "traceui", "gui", "adblib"]

[tool.setuptools.packages.find]
include = ["core*", "plugins*"]
namespaces = true

[tool.setuptools.package-data]
core = ["proc_options.json"]
